[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-generator"
version = "0.1.0"
description = "Отчёт Модули / План-Факт из Битрикс24"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "b24pysdk>=1.2.1",
    "customtkinter>=5.2.2",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
bitrix24-report = "report_generator.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
